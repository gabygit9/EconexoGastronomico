spring.profiles.active=dev
spring.application.name=Econexo
# ===============================
# SPRING DOC PROPERTIES
# ===============================
springdoc.packages-to-scan=com.tfi.Econexo.controllers
springdoc.show-actuator=true
springdoc.swagger-ui.disable-swagger-default-url=true
# swagger-ui custom path
springdoc.swagger-ui.path=/swagger-ui.html

# ===============================
# SPRING JACKSON PROPERTIES
# ===============================
spring.jackson.property-naming-strategy=SNAKE_CASE

# ===============================
# JWT PROPERTIES
# ===============================
security.jwt.private.key=${PRIVATE_KEY}
security.jwt.user.generator=${USER_GENERATOR}
security.jwt.expiration.minutes =${JWT_EXPIRATION_MINUTES:30}

# ===============================
# CLOUDINARY PROPERTIES
# ===============================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# ===============================
# GOOGLE MAPS PROPERTIES
# ===============================
econexo.google.maps.api-key=${GOOGLE_MAPS_API_KEY}

# ===============================
# EMAIL PROPERTIES
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
