<div class="mt-8 p-6 bg-orange-50 rounded-2xl border border-orange-200 flex flex-col items-center text-center">
  <h3 class="font-bold text-gray-900 mb-2">Apoyá a nuestras ONGs</h3>
  <p class="text-sm text-gray-600 mb-6">
    Tu donación económica es recibida directamente por las organizaciones
    que gestionan el rescate y la entrega de alimentos.
  </p>

  <button
    (click)="donate.emit()"
    class="w-full sm:w-auto bg-[#eb5c0c] text-white px-8 py-3 rounded-xl font-bold hover:bg-[#d1520a] transition-all shadow-md active:scale-[0.98]">
    Donar
  </button>
</div>
