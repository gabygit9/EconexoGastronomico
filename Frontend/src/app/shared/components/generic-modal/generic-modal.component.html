@if (isOpen()) {
  <div class="fixed inset-0 z-[9999] flex items-center justify-center bg-gray-900/40 backdrop-blur-sm p-4">
    <div class="bg-white rounded-3xl shadow-2xl w-full max-w-sm p-6 transform transition-all scale-100">

      <h3 class="text-xl font-extrabold text-center text-gray-900 mb-2">
        {{ title() }}
      </h3>
      <p class="text-center text-gray-500 text-sm mb-6">
        {{ message() }}
      </p>

      <div class="flex gap-3">
        @if(cancelText() != ''){
          <button
            (click)="cancel.emit()"
            class="flex-1 px-4 py-3 rounded-xl font-bold text-gray-600 bg-gray-100 hover:bg-gray-200 transition-colors">
            {{ cancelText() }}
          </button>
        }
        <button
          (click)="confirm.emit()"
          [class]="'flex-1 px-4 py-3 rounded-xl font-bold text-white shadow-md transition-colors ' + confirmButtonClass()">
          {{ confirmText() }}
        </button>
      </div>
    </div>
  </div>
}
