<nav class="bg-[#161c28] text-white px-6 py-4 flex justify-between items-center shadow-lg">
  <div class="flex items-center gap-2">
    <div class="w-8 h-8 bg-[#eb5c0c] rounded-lg flex items-center justify-center">
      <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
    </div>
    <span class="text-xl font-bold tracking-tight">EcoNexo</span>
  </div>

  <div class="flex items-center gap-4 md:gap-6">

    @if (authService.isAuthenticated$ | async){
      @if (userName) {
        <div class="hidden md:flex items-center gap-2">
          <div class="w-8 h-8 rounded-full bg-gray-800 border border-gray-600 flex items-center justify-center">
            <svg class="w-4 h-4 text-gray-400" fill="currentColor" viewBox="0 0 20 20">
              <path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd"></path>
            </svg>
          </div>
          <span class="text-sm font-medium text-gray-300">
          Hola, <span class="text-white font-bold">{{ userName }}</span>
        </span>
        </div>
        <div class="w-px h-5 bg-gray-700 hidden md:block"></div>
      }

      <button (click)="logout()" class="text-sm font-bold text-gray-400 hover:text-white transition-colors flex items-center gap-2">
        <span class="hidden sm:inline">Cerrar sesión</span>
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
      </button>
    } @else {
      <a routerLink="/login" class="text-sm font-bold text-gray-400 hover:text-white transition-colors">
        Iniciar sesión
      </a>
    }

  </div>
</nav>
