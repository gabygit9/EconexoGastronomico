@if (isOpen()) {
  <div class="fixed inset-0 z-[9999] flex items-center justify-center bg-gray-900/40 backdrop-blur-sm p-4">
    <div class="bg-white rounded-3xl shadow-2xl w-full max-w-sm p-6 transform transition-all scale-100 flex flex-col">

      <h3 class="text-xl font-extrabold text-center text-gray-900 mb-2">Generar Reporte</h3>
      <p class="text-center text-gray-500 text-sm mb-6">Seleccione el rango de fechas para el resumen.</p>

      <div class="flex flex-col gap-3 mb-6">
        <!-- Input DESDE -->
        <div class="flex flex-col gap-1">
          <label class="text-xs font-bold text-gray-400 uppercase">Desde</label>
          <input
            type="date"
            [(ngModel)]="startDate"
            [max]="endDate || today"
            class="border border-gray-200 p-3 rounded-xl w-full focus:ring-2 focus:ring-[#eb5c0c]/30 focus:border-[#eb5c0c] outline-none transition-all">
        </div>

        <!-- Input HASTA -->
        <div class="flex flex-col gap-1">
          <label class="text-xs font-bold text-gray-400 uppercase">Hasta</label>
          <input
            type="date"
            [(ngModel)]="endDate"
            [min]="startDate"
            [max]="today"
            class="border border-gray-200 p-3 rounded-xl w-full focus:ring-2 focus:ring-[#eb5c0c]/30 focus:border-[#eb5c0c] outline-none transition-all">
        </div>
      </div>

      <!-- Botones de Acción -->
      <div class="flex gap-3">
        <button
          (click)="close()"
          class="flex-1 px-4 py-3 rounded-xl font-bold text-gray-600 bg-gray-100 hover:bg-gray-200 transition-colors">
          Cancelar
        </button>

        <button
          (click)="isFormValid() ? confirm() : null"
          [disabled]="!isFormValid()"
          [class]="'flex-1 px-4 py-3 rounded-xl font-bold text-white shadow-md transition-all ' +
                   (isFormValid() ? 'bg-[#eb5c0c] hover:bg-[#d4530b]' : 'bg-gray-300 cursor-not-allowed')">
          Generar
        </button>
      </div>

    </div>
  </div>
}
