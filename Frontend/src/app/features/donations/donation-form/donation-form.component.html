<app-navbar [userName]="(userName$ | async) || ''"></app-navbar>


<div class="max-w-5xl mx-auto my-5 bg-white rounded-2xl shadow-md overflow-hidden">

  <div class="px-8 pt-8 pb-6 border-b border-gray-100">
    <span class="text-xs font-bold text-[#eb5c0c] uppercase tracking-widest">Donaciones</span>
    <h2 class="text-gray-900 text-2xl font-extrabold mt-1">Nueva Donación</h2>
    <p class="text-gray-400 text-sm mt-1">Publicá tu excedente en minutos</p>
  </div>

  <form [formGroup]="donationForm" (ngSubmit)="onSubmit()" class="p-8 space-y-10">

    <section>
      <h3 class="text-gray-900 text-lg font-bold flex items-center gap-2 mb-4">
        <span class="w-2 h-2 rounded-full bg-[#eb5c0c]"></span>
        Ventana horaria
      </h3>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
          <label class="label-form block">Disponible desde</label>
          <input type="datetime-local" formControlName="pickupStartTime" class="input-form">
        </div>
        <div>
          <label class="label-form block">Disponible hasta</label>
          <input type="datetime-local" formControlName="pickupEndTime" class="input-form">
        </div>
      </div>
    </section>

    <hr class="border-gray-100">

    <section formArrayName="items">
      <div class="flex justify-between items-end mb-6">
        <h3 class="text-gray-900 text-lg font-bold flex items-center gap-2">
          <span class="w-2 h-2 rounded-full bg-[#eb5c0c]"></span>
          Productos
        </h3>
        <span class="text-sm font-bold text-gray-400">{{ items.length }} ítem(s)</span>
      </div>

      <div class="space-y-6">
        @for (item of items.controls; track $index) {
          <div [formGroupName]="$index" class="p-6 bg-white border border-gray-200 rounded-xl relative group">

            <div class="flex justify-between items-center mb-6">
                <span class="text-[#eb5c0c] font-extrabold text-sm uppercase tracking-wide">
                  Ítem {{ $index + 1 }}
                </span>

              @if (items.length > 1) {
                <button type="button" (click)="removeItem($index)"
                        class="text-gray-400 hover:text-red-600 hover:bg-red-50 px-2 py-1 rounded-md transition-colors flex items-center gap-1 text-sm font-bold">
                  Quitar
                </button>
              }
            </div>

            <div class="grid grid-cols-1 md:grid-cols-4 gap-5">
              <div>
                <label class="label-form block text-xs">ID Producto</label>
                <input type="number" formControlName="productId" placeholder="Ej: 104" class="input-form">
              </div>

              <div>
                <label class="label-form block text-xs">Cantidad</label>
                <input type="number" formControlName="quantity" class="input-form">
              </div>

              <div>
                <label class="label-form block text-xs">Elaboración</label>
                <input type="date" formControlName="productionDate" class="input-form text-gray-500">
              </div>

              <div>
                <label class="label-form block text-xs">Vencimiento</label>
                <input type="date" formControlName="expirationDate" class="input-form text-gray-500">
              </div>

              <div>
                <label class="label-form block text-xs">Lote (Opcional)</label>
                <input type="text" formControlName="batchNumber" placeholder="Ej: L-123" class="input-form">
              </div>

              <div>
                <label class="label-form block text-xs">Temperatura</label>
                <input type="text" formControlName="deliveryTemperature" placeholder="Ej: Ambiente" class="input-form">
              </div>

              <div class="md:col-span-2">
                <label class="label-form block text-xs">Observaciones</label>
                <input type="text" formControlName="observations" placeholder="Ej: Cajas con pequeños golpes" class="input-form">
              </div>
            </div>

            <div class="mt-6 bg-[#fff6f0] p-4 rounded-lg border border-[#fbdabb]">
              <label class="flex items-center gap-2 text-xs font-bold text-[#eb5c0c] mb-3">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                Advertencia de Alérgenos (Opcional)
              </label>
              <input type="text" formControlName="allergenWarning" placeholder="Ninguna" class="input-form bg-white">
            </div>

          </div>
        }
      </div>

      <button type="button" (click)="addItem()"
              class="mt-6 w-full py-4 border-2 border-dashed border-[#eb5c0c] text-[#eb5c0c] font-bold rounded-xl hover:bg-[#fff6f0] transition-colors flex justify-center items-center gap-2">
        <span>+ Añadir Ítem</span>
      </button>
    </section>

    <hr class="border-gray-100">

    <div class="pt-2 flex justify-end">
      <button type="submit"
              class="w-full md:w-auto px-8 py-3.5 bg-[#eb5c0c] text-white font-bold rounded-lg hover:bg-[#d65108] focus:ring-4 focus:ring-[#eb5c0c]/30 transition-all flex items-center justify-center gap-2 shadow-sm">
        Publicar Excedente
      </button>
    </div>

  </form>
</div>
<app-footer></app-footer>
