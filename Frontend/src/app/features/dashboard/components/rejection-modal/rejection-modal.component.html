<div class="fixed inset-0 bg-gray-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg overflow-hidden border border-gray-100 flex flex-col">

    <div class="bg-[#161c28] text-white px-6 py-5 flex justify-between items-center shrink-0">
      <h3 class="text-lg font-bold flex items-center gap-2">
        <span class="w-2 h-2 rounded-full bg-[#eb5c0c]"></span>
        Registrar Rechazo
      </h3>
    </div>

    <div class="p-6 space-y-6 overflow-y-auto max-h-[70vh]">
      <div>
        <label class="block text-sm font-bold text-gray-700 mb-2">Motivo del rechazo</label>
        <textarea [(ngModel)]="rejectionData.reason" rows="3"
                  class="w-full p-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-[#eb5c0c]/30 focus:border-[#eb5c0c] transition-all"
                  placeholder="Ej: Alimentos con fecha vencida o en mal estado..."></textarea>
      </div>

      <div>
        <label class="block text-sm font-bold text-gray-700 mb-2">Foto de evidencia</label>
        <input type="file" (change)="onFileSelected($event)" accept="image/*"
               class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-bold file:bg-gray-100 file:text-gray-700 hover:file:bg-gray-200">
      </div>
    </div>

    <div class="p-6 border-t border-gray-100 flex gap-4 shrink-0 bg-white">
      <button (click)="close.emit(false)" class="flex-1 py-3.5 px-4 text-gray-600 font-bold hover:bg-gray-50 rounded-xl transition-colors border border-transparent">Cancelar</button>
      <button (click)="submitRejection()" [disabled]="isLoading || !rejectionData.reason || rejectionData.reason.trim().length === 0"
              class="flex-1 py-3.5 px-4 bg-[#eb5c0c] hover:bg-[#d65108] text-white font-bold rounded-xl transition-all shadow-sm focus:ring-4 focus:ring-[#eb5c0c]/30 disabled:opacity-50 disabled:cursor-not-allowed">
        {{ isLoading ? 'Enviando...' : 'Confirmar Rechazo' }}
      </button>
    </div>

  </div>
</div>
