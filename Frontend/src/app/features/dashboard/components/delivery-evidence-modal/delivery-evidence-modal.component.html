<div class="fixed inset-0 bg-gray-900/60 backdrop-blur-sm z-50 flex items-start sm:items-center justify-center p-4 overflow-y-auto">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg overflow-hidden border border-gray-100 flex flex-col my-8 sm:my-0 max-h-[90vh]">

    <div class="bg-[#161c28] text-white px-6 py-5 flex justify-between items-center shrink-0">
      <h3 class="text-lg font-bold flex items-center gap-2">
        <span class="w-2 h-2 rounded-full bg-[#eb5c0c]"></span>
        Registrar Entrega
      </h3>
      <button (click)="close.emit(false)" class="text-gray-400 hover:text-white transition-colors">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
      </button>
    </div>

    <div class="p-6 space-y-6 overflow-y-auto max-h-[70vh]">
      <div>
        <label class="block text-sm font-bold text-gray-700 mb-2">Temperatura (°C)</label>
        <input type="number" [(ngModel)]="evidence.temperature" class="w-full p-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-[#eb5c0c]/30 focus:border-[#eb5c0c] transition-all" placeholder="Ej: 4.5">
      </div>

      <div>
        <label class="block text-sm font-bold text-gray-700 mb-2">Foto de evidencia</label>
        <div class="flex flex-col gap-2">
          <label class="inline-flex items-center justify-center gap-2 bg-gray-100 hover:bg-gray-200 text-gray-700 text-sm font-bold py-2.5 px-4 rounded-full cursor-pointer transition-colors w-fit">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path>
            </svg>
            <span class="sm:hidden">Sacar foto</span>
            <span class="hidden sm:inline">Seleccionar archivo</span>
            <input type="file" accept="image/*" capture="environment" (change)="onFileSelected($event)" class="hidden">
          </label>
          @if (selectedFileName) {
            <span class="text-xs text-gray-500 truncate">{{ selectedFileName }}</span>
          }
        </div>
      </div>

      <div>
        <label class="block text-sm font-bold text-gray-700 mb-2">Firma del Donante</label>
        <div class="border border-gray-200 rounded-xl overflow-hidden mb-1 bg-gray-50">
          <app-signature-pad></app-signature-pad>
        </div>
        <button (click)="clearSignature()" class="text-xs text-red-600 font-bold hover:underline">Limpiar firma</button>
      </div>
      <div class="bg-gray-50 p-4 rounded-xl border border-gray-200">
        <div class="flex items-start gap-3">
          <input type="checkbox" id="disclaimer"
                 [ngModel]="acceptedDisclaimer()"
                 (ngModelChange)="acceptedDisclaimer.set($event)"
                 class="mt-1 w-5 h-5 accent-[#eb5c0c] cursor-pointer">
          <label for="disclaimer" class="text-xs text-gray-600 leading-tight">
            Al confirmar, declaro que la temperatura es correcta y los productos se entregan en buen estado.
            Acepto los <button (click)="openTerms()" class="text-[#eb5c0c] font-bold underline">términos y condiciones</button> de EcoNexo.
          </label>
        </div>
      </div>
    </div>

    <div class="p-6 border-t border-gray-100 flex gap-4 shrink-0 bg-white">

      <button (click)="close.emit(false)" class="flex-1 py-3.5 px-4 text-gray-600 font-bold hover:bg-gray-50 rounded-xl transition-colors border border-transparent">Cancelar</button>
      <button (click)="submitEvidence()" [disabled]="isLoading || !acceptedDisclaimer()"
              class="flex-1 py-3.5 px-4 bg-[#eb5c0c] hover:bg-[#d65108] text-white font-bold rounded-xl transition-all shadow-sm focus:ring-4 focus:ring-[#eb5c0c]/30 disabled:opacity-50 disabled:cursor-not-allowed">
        {{ isLoading ? 'Enviando...' : 'Confirmar' }}
      </button>
    </div>

  </div>
</div>

<app-generic-modal
  [isOpen]="isTermsOpen"
  title="Términos y Condiciones"
  message="Al confirmar esta entrega, usted declara que los productos están en condiciones óptimas para el consumo, respetando las normas de seguridad alimentaria. EcoNexo actúa como facilitador logístico y no es responsable por el estado final de los alimentos una vez entregados."
  confirmText="Entendido"
  [cancelText]="''"
  (confirm)="isTermsOpen = false"
  (cancel)="isTermsOpen = false">
</app-generic-modal>
