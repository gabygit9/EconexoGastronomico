<div class="min-h-screen bg-gray-50 flex flex-col">

  <app-navbar [userName]="(userName$ | async ) || ''"></app-navbar>

  <main class="flex-1 flex items-center justify-center p-6">
    <div class="max-w-2xl w-full text-center space-y-8">

      <div class="relative inline-block">
        <div class="absolute inset-0 bg-orange-100 rounded-full animate-ping opacity-20"></div>
        <div class="relative bg-white p-10 rounded-full shadow-xl border-2 border-orange-50">
          <svg class="w-24 h-24 text-[#eb5c0c]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path>
          </svg>
        </div>
      </div>

      <div class="space-y-4">
        <h1 class="text-4xl md:text-5xl font-extrabold text-[#161c28] tracking-tight">
          ¡Hola, Donante! <br>
          <span class="text-[#eb5c0c]">Estamos en construcción.</span>
        </h1>
        <p class="text-lg text-gray-500 max-w-lg mx-auto leading-relaxed">
          Tu panel de control para gestionar excedentes de alimentos está siendo preparado.
          Pronto podrás cargar donaciones y ver tu impacto social en tiempo real.
        </p>
      </div>

    </div>
  </main>

  <app-footer></app-footer>

</div>
