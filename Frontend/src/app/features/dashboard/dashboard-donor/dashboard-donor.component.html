<div class="min-h-screen bg-gray-50 flex flex-col">

  <app-navbar [userName]="(userName$ | async) || '' "></app-navbar>

  <main class="flex-1 p-6 lg:p-8 max-w-7xl mx-auto w-full">

    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
      <div>
        <h1 class="text-3xl font-extrabold text-[#161c28] tracking-tight">Panel de Donaciones</h1>
        <p class="text-gray-500 mt-1 text-sm">Gestioná tus excedentes alimentarios y seguí el estado de los retiros.</p>
      </div>

      <button (click)="goToNewDonation()"
              class="px-6 py-3 bg-[#eb5c0c] text-white font-bold rounded-xl hover:bg-[#d65108] transition-all shadow-md active:scale-[0.98] flex items-center justify-center gap-2">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"></path>
        </svg>
        Publicar Excedente
      </button>
    </div>

    <div class="space-y-6">
      <app-donation-list
        [donations]="myDonations()"
        [viewRole]="'DONOR'"
        (actionRequested)="handleAction($event)"
        (rowClick)="openDetail($event)">
      </app-donation-list>
    </div>


    <div class="mt-8 bg-gradient-to-r from-orange-50 to-orange-100 p-6 rounded-2xl border border-orange-200">
      <div class="flex flex-col md:flex-row md:justify-between md:items-center gap-4">
        <div>
          <h3 class="text-lg font-bold text-gray-900">¿Querés ir un paso más allá?</h3>
          <p class="text-gray-600">Tu apoyo económico ayuda a las ONGs a sostener su logística diaria.</p>
        </div>
        <button
          (click)="openPaymentModal()"
          class="w-full md:w-auto bg-[#eb5c0c] text-white px-6 py-3 rounded-xl font-bold hover:bg-[#d1520a] transition-all shadow-md shrink-0">
          Donar dinero
        </button>
      </div>
    </div>

    @if (showPaymentModal()) {
      <div class="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg relative animate-in fade-in zoom-in duration-200">
          <button (click)="showPaymentModal.set(false)" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
          </button>
          <app-donation-payment></app-donation-payment>
        </div>
      </div>
    }


    @if (showModal()) {
      <app-donation-confirm-modal
        [donation]="selectedDonation()!"
        [title]="actionType() === 'CANCEL' ? 'Cancelar Donación' : 'Rechazar Conductor'"
        [message]="actionType() === 'CANCEL' ? '¿Estás seguro de cancelar esta donación?' : '¿Confirmás el rechazo del conductor?'"
        [confirmButtonText]="actionType() === 'CANCEL' ? 'Sí, Cancelar' : 'Sí, Rechazar'"
        [infoMessage]="null"
        (confirm)="handleConfirm()"
        (close)="showModal.set(false)">
      </app-donation-confirm-modal>
    }

  </main>

  <app-footer></app-footer>

</div>
