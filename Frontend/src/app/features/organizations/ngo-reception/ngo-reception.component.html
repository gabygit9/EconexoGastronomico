<div class="p-6 max-w-3xl mx-auto space-y-6">
  <button (click)="goBack()" class="text-gray-500 font-bold text-sm">← Volver al Panel</button>

  <div class="bg-white p-8 rounded-2xl shadow-sm border border-gray-100">
    <h2 class="text-2xl font-extrabold text-gray-950 mb-6">Recepción de Donación #{{ donationId() }}</h2>

    @if (isLoading()) {
      <p>Cargando lista de carga esperada...</p>
    } @else {
      <table class="w-full text-left">
        <thead class="text-xs uppercase text-gray-400 border-b">
        <tr><th class="pb-3">Producto</th><th class="pb-3">Cantidad</th><th class="pb-3">Descripción</th></tr>
        </thead>
        <tbody>
          @for (item of items(); track item.itemId) {
            <tr class="border-b last:border-0">
              <td class="py-4 font-bold">{{ item.productName }}</td>
              <td class="py-4">{{ item.expectedQuantity }} {{ item.unitOfMeasure }}</td>
              <td class="py-4 text-gray-600">{{ item.description }}</td>
            </tr>
          }
        </tbody>
      </table>

      <div class="mt-8">
        <label class="block text-sm font-bold text-gray-700 mb-2">Comentarios (Opcional)</label>
        <textarea [(ngModel)]="comments" class="w-full p-3 border rounded-xl" rows="3" placeholder="¿Llegó todo bien?"></textarea>
      </div>

      <button (click)="confirmReception()" class="mt-6 w-full bg-emerald-600 text-white py-4 rounded-xl font-extrabold hover:bg-emerald-700">
        Confirmar Recepción
      </button>
    }
  </div>
</div>
