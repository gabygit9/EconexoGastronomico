<div class="p-6 max-w-3xl mx-auto space-y-6">
  <button (click)="goBack()" class="text-gray-500 font-bold text-sm hover:text-[#eb5c0c] transition-colors">← Volver al Panel</button>

  <div class="bg-white p-8 rounded-2xl shadow-sm border border-gray-100">

    <!-- Lógica de Escaneo QR -->
    <div class="space-y-6">
      <div class="mb-4">
        <button (click)="startScanner()" class="w-full md:w-auto bg-[#eb5c0c] hover:bg-[#d4530b] text-white font-extrabold py-3 px-6 rounded-xl transition-all shadow-lg shadow-orange-100 flex items-center justify-center gap-3 active:scale-[0.98]">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4M4 12l8-8m-8 8l8 8"></path>
          </svg>
          Validar con QR
        </button>
      </div>

      @if (isScanning()) {
        <div class="fixed inset-0 z-50 bg-black p-4 flex flex-col items-center justify-center">
          <ngx-scanner-qrcode
            #action="scanner"
            [config]="config"
            (event)="handleQrCode($event)">
          </ngx-scanner-qrcode>
          <button (click)="scanner.stop(); isScanning.set(false)" class="mt-6 bg-white/10 hover:bg-white/20 text-white font-bold py-3 px-8 rounded-xl transition-all border border-white/20">
            Cancelar Escaneo
          </button>
        </div>
      }
    </div>

    <h2 class="text-2xl font-extrabold text-gray-950 mb-6">Recepción de Donación #{{ donationId() }}</h2>

    @if (isLoading()) {
      <p class="text-gray-500 animate-pulse">Cargando lista de carga esperada...</p>
    } @else {
      <div class="overflow-x-auto">
        <table class="w-full text-left">
          <thead class="text-xs uppercase text-gray-400 border-b border-gray-100">
          <tr>
            <th class="pb-3 text-center">Recibido</th>
            <th class="pb-3">Producto</th>
            <th class="pb-3">Cantidad</th>
          </tr>
          </thead>
          <tbody>
            @for (item of items(); track item.itemId) {
              <tr class="border-b border-gray-50 transition-opacity" [class.opacity-50]="!item.received">
                <td class="py-4 text-center">
                  <input type="checkbox" [(ngModel)]="item.received" class="w-5 h-5 accent-[#eb5c0c] cursor-pointer">
                </td>
                <td class="py-4 font-bold text-gray-800">{{ item.productName }}</td>
                <td class="py-4 text-gray-600">{{ item.expectedQuantity }} {{ item.unitOfMeasure }}</td>
              </tr>
            }
          </tbody>
        </table>
      </div>

      <div class="mt-8">
        <label class="block text-sm font-bold text-gray-700 mb-2">Comentarios (Opcional)</label>
        <textarea [(ngModel)]="comments"
                  class="w-full p-4 border border-gray-200 rounded-xl focus:ring-2 focus:ring-orange-500 outline-none"
                  rows="3"
                  placeholder="¿Faltó algo? Indicalo aquí..."></textarea>
      </div>

      <button (click)="confirmReception()"
              class="mt-6 w-full bg-emerald-600 text-white py-4 rounded-xl font-extrabold hover:bg-emerald-700 transition-all active:scale-[0.98]">
        Confirmar Recepción
      </button>
    }
  </div>
</div>
